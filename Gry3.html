<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - Assassin's Creed</title>
    <style>
        body {
            font-family: "Courier New", Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #fff;
            overflow: hidden;
        }

        .status-box {
            position: fixed;
            padding: 15px 25px;
            border: 3px solid black;
            background-color: #f9f9f9;
            font-size: 28px;
            font-weight: bold;
            z-index: 10;
        }

        #timer { top: 20px; left: 20px; }
        #points { top: 20px; right: 20px; }
        #remaining-container { bottom: 20px; left: 20px; }

        .question-text {
            font-size: 26px;
            font-weight: bold;
            text-align: center;
            position: absolute;
            top: 10%;
            width: 80%;
            line-height: 1.4;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
        }

        .input-group {
            display: flex;
            gap: 15px;
        }

        input[type="text"] {
            width: 500px;
            height: 70px;
            border: 4px solid black;
            font-size: 24px;
            padding: 0 20px;
            outline: none;
        }

        button {
            height: 78px;
            padding: 0 30px;
            border: 4px solid black;
            background: black;
            color: white;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
            font-family: inherit;
        }

        #found-wrapper {
            width: 700px;
            max-height: 150px;
            overflow-y: auto;
            border: 1px dashed #ccc;
            padding: 10px;
            margin-top: 10px;
            text-align: center;
        }

        #found-list {
            font-size: 18px;
            color: #444;
            font-weight: bold;
        }

        #game-over-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.98);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            text-align: center;
        }

        #game-over-screen h2 { font-size: 60px; margin: 0; }
        #game-over-screen p { font-size: 35px; font-weight: bold; }

        #feedback { font-size: 20px; font-weight: bold; height: 25px; }
    </style>
</head>
<body>

    <div id="timer" class="status-box">00:00</div>
    <div id="points" class="status-box">Pkt: 0</div>
    
    <div id="remaining-container" class="status-box">
        Zostało: <span id="remaining">16</span>
    </div>

    <div class="question-text">
        Wymień Asasynów z serii Assassin's Creed
    </div>

    <div class="main-container">
        <div id="feedback"></div>
        <div class="input-group">
            <input type="text" id="answerInput" placeholder="Imię (i nazwisko)..." autocomplete="off">
            <button id="checkBtn" onclick="checkAnswer()">DODAJ</button>
        </div>
        <div id="found-wrapper">
            <div id="found-list">Znalezione: (brak)</div>
        </div>
    </div>

    <div id="game-over-screen">
        <h2 id="end-title">KONIEC GRY</h2>
        <p id="final-score">Twój wynik: 0 PKT</p>
        <button onclick="location.reload()" style="background: black; color: white; padding: 20px; cursor: pointer;">ZAGRAJ PONOWNIE</button>
    </div>

    <script>
        let score = 0;
        let seconds = 0;
        let isGameOver = false;
        
        // Lista Asasynów
        const requiredAnswers = [
            "ezio auditore", "altair", "edward kenway", "kasandra", 
            "eivor", "bayek", "connor kenway", "aleksios", 
            "evie frye", "jacob frye", "arno dorian", "aguilar de nerha", 
            "shao jun", "arbaaz mir", "fujibayashi naoe", "basim ibn ishaq"
        ];
        
        let foundAnswers = [];

        const timerInterval = setInterval(() => {
            if(!isGameOver) {
                seconds++;
                let mins = Math.floor(seconds / 60);
                let secs = seconds % 60;
                document.getElementById('timer').innerText = 
                    `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }
        }, 1000);

        function showEndScreen(win = false) {
            isGameOver = true;
            clearInterval(timerInterval);
            const screen = document.getElementById('game-over-screen');
            const title = document.getElementById('end-title');
            
            title.innerText = win ? "MISTRZ ASASYŃSKI!" : "WYKRYTO CIĘ / KONIEC GRY";
            title.style.color = win ? "green" : "red";
            
            document.getElementById('final-score').innerText = `Twój wynik: ${score} PKT`;
            screen.style.display = 'flex';
        }

        function checkAnswer() {
            if(isGameOver) return;

            const inputField = document.getElementById('answerInput');
            const feedback = document.getElementById('feedback');
            // Normalizacja tekstu
            const userInput = inputField.value.trim().toLowerCase().replace(/\s+/g, ' ');

            if (userInput === "") return;

            if (requiredAnswers.includes(userInput)) {
                if (foundAnswers.includes(userInput)) {
                    showEndScreen(false); // Powtórka
                } else {
                    score += 3;
                    foundAnswers.push(userInput);
                    
                    document.getElementById('points').innerText = `Pkt: ${score}`;
                    document.getElementById('remaining').innerText = requiredAnswers.length - foundAnswers.length;
                    document.getElementById('found-list').innerText = "Znalezione: " + foundAnswers.join(", ");
                    
                    feedback.innerText = "DOBRZE! +3 PKT";
                    feedback.style.color = "green";
                    inputField.value = "";

                    const wrapper = document.getElementById('found-wrapper');
                    wrapper.scrollTop = wrapper.scrollHeight;

                    if (foundAnswers.length === requiredAnswers.length) {
                        setTimeout(() => showEndScreen(true), 1000);
                    }
                }
            } else {
                showEndScreen(false); // Błąd
            }
        }

        document.getElementById('answerInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkAnswer();
        });
    </script>
</body>
</html>
