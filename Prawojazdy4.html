<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - Znaki Zakazu</title>
    <style>
        body {
            font-family: "Courier New", Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #fff;
            overflow: hidden;
        }

        .status-box {
            position: fixed;
            padding: 12px 20px;
            border: 3px solid black;
            background-color: #f9f9f9;
            font-size: 24px;
            font-weight: bold;
            z-index: 10;
        }

        #timer { top: 20px; left: 20px; }
        #points { top: 20px; right: 20px; }
        #remaining-container { bottom: 20px; left: 20px; }

        .question-text {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            position: absolute;
            top: 10%;
            width: 90%;
            line-height: 1.3;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
        }

        .input-group {
            display: flex;
            gap: 15px;
        }

        input[type="text"] {
            width: 550px;
            height: 60px;
            border: 4px solid black;
            font-size: 20px;
            padding: 0 15px;
            outline: none;
        }

        button {
            height: 68px;
            padding: 0 25px;
            border: 4px solid black;
            background: black;
            color: white;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            font-family: inherit;
        }

        #found-wrapper {
            width: 800px;
            max-height: 200px;
            overflow-y: auto;
            border: 1px dashed #ccc;
            padding: 10px;
            margin-top: 10px;
            text-align: left;
        }

        #found-list {
            font-size: 16px;
            color: #333;
            line-height: 1.5;
        }

        #game-over-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.98);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        #game-over-screen h2 { font-size: 60px; margin: 0; }
        #game-over-screen p { font-size: 30px; font-weight: bold; }

        #feedback { font-size: 18px; font-weight: bold; height: 25px; }
    </style>
</head>
<body>

    <div id="timer" class="status-box">00:00</div>
    <div id="points" class="status-box">Pkt: 0</div>
    
    <div id="remaining-container" class="status-box">
        Zostało: <span id="remaining">52</span>
    </div>

    <div class="question-text">
        Wymień znaki drogowe ZAKAZU (seria B)<br>
        <span style="font-size: 16px; font-weight: normal;">(Uwaga: W nazwach z parametrem używaj trzech kropek, np. "... m." lub "... t.")</span>
    </div>

    <div class="main-container">
        <div id="feedback"></div>
        <div class="input-group">
            <input type="text" id="answerInput" placeholder="Wpisz pełną nazwę znaku..." autocomplete="off">
            <button id="checkBtn" onclick="checkAnswer()">DODAJ</button>
        </div>
        <div id="found-wrapper">
            <div id="found-list">Znalezione: (brak)</div>
        </div>
    </div>

    <div id="game-over-screen">
        <h2 id="end-title">KONIEC GRY</h2>
        <p id="final-score">Twój wynik: 0 PKT</p>
        <button onclick="location.reload()" style="background: black; color: white; padding: 20px; cursor: pointer;">SPRÓBUJ PONOWNIE</button>
    </div>

    <script>
        let score = 0;
        let seconds = 0;
        let isGameOver = false;
        
        // Pełna lista znaków (znormalizowana do małych liter dla porównania)
        const requiredAnswers = [
            "zakaz ruchu w obu kierunkach", "zakaz wjazdu", "zakaz wjazdu pojazdów silnikowych, z wyjątkiem motocykli jednośladowych",
            "zakaz wjazdu autobusów", "zakaz wjazdu motocykli", "zakaz wjazdu samochodów ciężarowych", "zakaz wjazdu ciągników rolniczych",
            "zakaz wjazdu pojazdów silnikowych z przyczepą", "zakaz wjazdu pojazdów zaprzęgowych", "zakaz wjazdu rowerów",
            "zakaz wjazdu motorowerów", "zakaz wjazdu wózków rowerowych i rowerów wielośladowych", "zakaz wjazdu wózków ręcznych",
            "zakaz wjazdu pojazdów z materiałami wybuchowymi lub łatwo zapalnymi", "zakaz wjazdu pojazdów z materiałami niebezpiecznymi",
            "zakaz wjazdu pojazdów z materiałami, które mogą skazić wodę", "zakaz wjazdu pojazdów o szerokości ponad ... m.",
            "zakaz wjazdu pojazdów o wysokości ponad ... m.", "zakaz wjazdu pojazdów o długości ponad ... m.",
            "zakaz wjazdu pojazdów o rzeczywistej masie całkowitej ponad ... t.", "zakaz wjazdu pojazdów o nacisku osi większym niż ... t.",
            "stop", "zakaz skręcania w lewo", "zakaz skręcania w prawo", "zakaz zawracania", "koniec zakazu zawracania",
            "zakaz wyprzedzania", "zakaz wyprzedzania przez samochody ciężarowe", "koniec zakazu wyprzedzania",
            "koniec zakazu wyprzedzania przez samochody ciężarowe", "zakaz używania sygnałów dźwiękowych",
            "koniec zakazu używania sygnałów dźwiękowych", "pierwszeństwo dla nadjeżdżających z przeciwka", "stój - kontrola celna",
            "stój – kontrola graniczna", "stój – uszkodzona rogatka", "stój - uszkodzona sygnalizacja", "stój - wjazd na prom",
            "stój – kontrola drogowa", "stój – pobór opłat", "ograniczenie prędkości", "koniec ograniczenia prędkości",
            "zakaz postoju", "zakaz zatrzymywania się", "zakaz postoju w dni nieparzyste", "zakaz postoju w dni parzyste",
            "strefa ograniczonego postoju", "koniec strefy ograniczonego postoju", "zakaz ruchu pieszych", "koniec zakazów",
            "strefa ograniczonej prędkości", "koniec strefy ograniczonej prędkości"
        ];
        
        let foundAnswers = [];

        const timerInterval = setInterval(() => {
            if(!isGameOver) {
                seconds++;
                let mins = Math.floor(seconds / 60);
                let secs = seconds % 60;
                document.getElementById('timer').innerText = 
                    `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }
        }, 1000);

        function showEndScreen(win = false) {
            isGameOver = true;
            clearInterval(timerInterval);
            const screen = document.getElementById('game-over-screen');
            document.getElementById('end-title').innerText = win ? "MISTRZ ZNAKÓW!" : "KONIEC GRY";
            document.getElementById('end-title').style.color = win ? "green" : "red";
            document.getElementById('final-score').innerText = `Twój wynik: ${score} PKT`;
            screen.style.display = 'flex';
        }

        function checkAnswer() {
            if(isGameOver) return;
            const inputField = document.getElementById('answerInput');
            const userInput = inputField.value.trim().toLowerCase().replace(/\s+/g, ' ');

            if (userInput === "") return;

            if (requiredAnswers.includes(userInput)) {
                if (foundAnswers.includes(userInput)) {
                    showEndScreen(false); // Powtórka
                } else {
                    score += 1;
                    foundAnswers.push(userInput);
                    document.getElementById('points').innerText = `Pkt: ${score}`;
                    document.getElementById('remaining').innerText = requiredAnswers.length - foundAnswers.length;
                    document.getElementById('found-list').innerText = "Znalezione: " + foundAnswers.join(", ");
                    
                    document.getElementById('feedback').innerText = "DOBRZE!";
                    document.getElementById('feedback').style.color = "green";
                    inputField.value = "";
                    
                    const wrapper = document.getElementById('found-wrapper');
                    wrapper.scrollTop = wrapper.scrollHeight;

                    if (foundAnswers.length === requiredAnswers.length) showEndScreen(true);
                }
            } else {
                showEndScreen(false); // Błąd
            }
        }

        document.getElementById('answerInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkAnswer();
        });
    </script>
</body>
</html>
