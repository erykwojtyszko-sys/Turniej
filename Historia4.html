<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Historyczny - Wielkie Państwa</title>
    <style>
        body {
            font-family: "Courier New", Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #fff;
            overflow: hidden;
        }

        .status-box {
            position: fixed;
            padding: 12px 20px;
            border: 3px solid black;
            background-color: #f9f9f9;
            font-size: 24px;
            font-weight: bold;
            z-index: 10;
        }

        #timer { top: 20px; left: 20px; }
        #points { top: 20px; right: 20px; }
        #remaining-container { bottom: 20px; left: 20px; }

        .question-text {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            position: absolute;
            top: 10%;
            width: 90%;
            line-height: 1.3;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
        }

        .input-group {
            display: flex;
            gap: 15px;
        }

        input[type="text"] {
            width: 550px;
            height: 60px;
            border: 4px solid black;
            font-size: 20px;
            padding: 0 15px;
            outline: none;
            text-align: center;
        }

        button {
            height: 68px;
            padding: 0 25px;
            border: 4px solid black;
            background: black;
            color: white;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            font-family: inherit;
        }

        #found-wrapper {
            width: 800px;
            max-height: 180px;
            overflow-y: auto;
            border: 1px dashed #ccc;
            padding: 10px;
            margin-top: 10px;
            text-align: left;
        }

        #found-list {
            font-size: 16px;
            color: #333;
            line-height: 1.5;
        }

        #game-over-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.98);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        #game-over-screen h2 { font-size: 60px; margin: 0; }
        #game-over-screen p { font-size: 30px; font-weight: bold; }

        #feedback { font-size: 18px; font-weight: bold; height: 25px; }
    </style>
</head>
<body>

    <div id="timer" class="status-box">00:00</div>
    <div id="points" class="status-box">Pkt: 0</div>
    
    <div id="remaining-container" class="status-box">
        Zostało: <span id="remaining">52</span>
    </div>

    <div class="question-text">
        Wymień państwa/imperia, które w historii miały powyżej 500 tys. km²
    </div>

    <div class="main-container">
        <div id="feedback"></div>
        <div class="input-group">
            <input type="text" id="answerInput" placeholder="Wpisz nazwę państwa..." autocomplete="off">
            <button id="checkBtn" onclick="checkAnswer()">DODAJ</button>
        </div>
        <div id="found-wrapper">
            <div id="found-list">Znalezione: (brak)</div>
        </div>
    </div>

    <div id="game-over-screen">
        <h2 id="end-title">KONIEC GRY</h2>
        <p id="final-score">Twój wynik: 0 PKT</p>
        <button onclick="location.reload()" style="background: black; color: white; padding: 20px; cursor: pointer;">ZAGRAJ PONOWNIE</button>
    </div>

    <script>
        let score = 0;
        let seconds = 0;
        let isGameOver = false;
        
        const requiredAnswers = [
            "imperium brytyjskie", "imperium mongolskie", "imperium rosyjskie", "imperium hiszpańskie", 
            "imperium francuskie", "imperium osmańskie", "imperium rzymskie", "dynastia qing", 
            "imperium achemenidów", "imperium seleucydów", "imperium partów", "imperium sasanidów", 
            "imperium maurjów", "imperium guptów", "kalifat umajjadów", "kalifat abbasydów", 
            "imperium timurydów", "imperium mogołów", "dynastia tang", "dynastia han", 
            "dynastia yuan", "dynastia ming", "złota orda", "chanat czagatajski", 
            "ilchanat", "imperium hunów", "kaganat turków", "chanat krymski", 
            "święte cesarstwo rzymskie", "cesarstwo niemieckie", "rzeczpospolita obojga narodów", "królestwo francji", 
            "królestwo hiszpanii", "królestwo szwecji", "unia kalmarska", "królestwo węgier", 
            "imperium napoleońskie", "imperium mali", "imperium songhaj", "cesarstwo etiopii", 
            "kalifat fatymidów", "imperium ajjubidów", "imperium inków", "imperium azteków", 
            "wicekrólestwo nowej hiszpanii", "wicekrólestwo peru", "imperium portugalskie", "imperium holenderskie", 
            "imperium belgijskie", "imperium japońskie", "stany zjednoczone", "brazylia"
        ];
        
        let foundAnswers = [];

        const timerInterval = setInterval(() => {
            if(!isGameOver) {
                seconds++;
                let mins = Math.floor(seconds / 60);
                let secs = seconds % 60;
                document.getElementById('timer').innerText = 
                    `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }
        }, 1000);

        function showEndScreen(win = false) {
            isGameOver = true;
            clearInterval(timerInterval);
            const screen = document.getElementById('game-over-screen');
            document.getElementById('end-title').innerText = win ? "WIELKI ZDOBYWCA!" : "KONIEC GRY";
            document.getElementById('end-title').style.color = win ? "green" : "red";
            document.getElementById('final-score').innerText = `Twój wynik: ${score} PKT`;
            screen.style.display = 'flex';
        }

        function checkAnswer() {
            if(isGameOver) return;
            const inputField = document.getElementById('answerInput');
            const userInput = inputField.value.trim().toLowerCase().replace(/\s+/g, ' ');

            if (userInput === "") return;

            if (requiredAnswers.includes(userInput)) {
                if (foundAnswers.includes(userInput)) {
                    showEndScreen(false);
                } else {
                    score += 1;
                    foundAnswers.push(userInput);
                    document.getElementById('points').innerText = `Pkt: ${score}`;
                    document.getElementById('remaining').innerText = requiredAnswers.length - foundAnswers.length;
                    document.getElementById('found-list').innerText = "Znalezione: " + foundAnswers.join(", ");
                    
                    document.getElementById('feedback').innerText = "DOBRZE!";
                    document.getElementById('feedback').style.color = "green";
                    inputField.value = "";
                    
                    const wrapper = document.getElementById('found-wrapper');
                    wrapper.scrollTop = wrapper.scrollHeight;

                    if (foundAnswers.length === requiredAnswers.length) showEndScreen(true);
                }
            } else {
                showEndScreen(false);
            }
        }

        document.getElementById('answerInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkAnswer();
        });
    </script>
</body>
</html>
